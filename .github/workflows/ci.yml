name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System libraries (WeasyPrint, LightGBM)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 libgomp1

      - name: Install
        run: |
          pip install -e ".[dev]"
          python -m nltk.downloader cmudict

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest --cov --cov-report=term-missing
